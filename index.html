<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maasin SLP Egg Sales Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Maasin SLP</p>
      <h1>Egg Sales Tracker</h1>
      <p class="intro">Record each sale and keep track of your total income.</p>
    </header>

    <section class="panel" aria-labelledby="sale-form-title">
      <h2 id="sale-form-title">Record a sale</h2>
      <form id="sale-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="trays">Trays sold</label>
            <input id="trays" name="trays" type="number" min="0.01" step="any" inputmode="decimal" required>
          </div>
          <div class="field">
            <label for="price">Price per tray (₱)</label>
            <input id="price" name="price" type="number" min="0.01" step="any" inputmode="decimal" required>
          </div>
          <div class="field">
            <label for="sale-date">Sale date</label>
            <input id="sale-date" name="saleDate" type="date" required>
          </div>
          <div class="field">
            <label for="customer">Customer name <span>(optional)</span></label>
            <input id="customer" name="customer" type="text" maxlength="80" autocomplete="off" placeholder="Leave blank if not needed">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Save sale</button>
          <p id="form-message" class="message" role="alert" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="sales-list-title">
      <h2 id="sales-list-title">Sales</h2>
      <div class="summary" aria-live="polite">
        <span class="summary-label">Total sales amount</span>
        <span id="total-sales" class="summary-total">₱0.00</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Customer</th>
              <th scope="col">Trays</th>
              <th scope="col">Price / tray</th>
              <th scope="col">Total</th>
            </tr>
          </thead>
          <tbody id="sales-list"></tbody>
        </table>
        <p id="empty-state" class="empty-state">No sales recorded yet. Add your first sale above.</p>
      </div>
    </section>
  </main>

  
  <script src="script.js"></script>
</body>
</html>
